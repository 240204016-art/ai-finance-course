<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Курс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1657e6; --blue-dark:#0d3fb5; --ink:#101b3a; --text:#2a3350; --muted:#5d6785;
  --soft:#e9f0fd; --card:#fff; --dark:#15171d; --dark-2:#20232c; --line:#2c303b; --gold:#f2b736;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--text);font:500 15px/1.5 Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
section{padding:44px 16px}
.wrap{max-width:560px;margin:0 auto}
.soft{background:var(--soft)}
h1,h2{margin:0;color:var(--ink);font-weight:900;line-height:1.08;text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(26px,7.4vw,40px);text-align:center}
h2{font-size:clamp(22px,6.2vw,32px)}
h1 span,h2 span{display:block}
h1 span+span,h2 span+span{color:var(--blue)}
.center{text-align:center}

.badge{display:flex;width:fit-content;margin:0 auto 22px;align-items:center;gap:8px;padding:7px 16px;border:1px solid #d5def2;border-radius:99px;font-size:12px;font-weight:600;color:var(--ink)}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue)}
.lead{margin:16px auto 24px;max-width:460px;text-align:center;font-size:14px}

.video{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--dark);border:3px solid #dfe8fb;display:grid;place-items:center;color:#8a93ab;font-size:13px}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}

.btn{position:relative;display:block;width:100%;margin-top:24px;padding:19px 20px;border:0;border-radius:14px;background:linear-gradient(180deg,#2a6df5,var(--blue));box-shadow:0 5px 0 var(--blue-dark),0 14px 24px -10px rgba(22,87,230,.7);color:#fff;font:700 16px/1.2 inherit;font-family:inherit;text-align:center;text-decoration:none;cursor:pointer;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-dark)}
.btn:focus-visible,.faq button:focus-visible,.promo button:focus-visible,input:focus-visible{outline:3px solid #9dbcff;outline-offset:2px}
.sticker{position:absolute;right:10px;top:-12px;padding:5px 10px;border-radius:99px;background:var(--ink);font-size:11px;font-weight:700;transform:rotate(6deg);white-space:nowrap}
.under{margin:18px auto 0;max-width:420px;text-align:center;font-size:12.5px;color:var(--muted)}

.features{display:grid;gap:12px;margin-top:22px}
.feature{padding:18px;border-radius:14px;background:var(--card);box-shadow:0 1px 0 #d8e2f7}
.feature b{display:flex;gap:10px;align-items:baseline;color:var(--ink);font-size:16px;font-weight:700}
.feature b i{font-style:normal;color:var(--blue);font-weight:900;font-variant-numeric:tabular-nums}
.feature p{margin:6px 0 0;font-size:13.5px}

.pack{margin-top:24px;padding:22px 18px;border-radius:18px;background:var(--dark);color:#e8ebf3}
.pack h3{margin:0 0 6px;font-size:20px;font-weight:700;color:#fff}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.row span:last-child{color:#6ea0ff;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.total{margin-top:18px;font-size:14px;font-weight:600}
.total s{color:#8d94a6}
.price{font-size:40px;font-weight:900;color:#fff;line-height:1.2;font-variant-numeric:tabular-nums}
.timer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:10px 16px;border:1px solid #2f4f9c;border-radius:12px;background:#192542;font-size:13px;font-weight:600}
.timer b{font-size:22px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.promo{display:flex;gap:8px;margin-top:12px}
.promo input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--dark-2);color:#fff;font:600 14px inherit;font-family:inherit;text-transform:uppercase}
.promo input::placeholder{color:#7d8496;text-transform:none}
.promo button{padding:0 18px;border:0;border-radius:10px;background:#fff;color:var(--ink);font:700 13px inherit;font-family:inherit;cursor:pointer}
.promo-msg{min-height:18px;margin:6px 2px 0;font-size:12px;color:#8fd6a4}
.promo-msg.err{color:#ff9a9a}
.note{margin-top:12px;padding:12px 14px;border:1px solid #6d5516;border-radius:12px;background:#231d0c;font-size:12.5px;color:#e9dfc4}
.terms{margin:16px 0 0;text-align:center;font-size:11.5px;color:#9aa1b3}
.terms a{color:#dfe4f1}

.faq{display:grid;gap:10px;margin-top:22px}
.faq div{border-radius:12px;background:var(--card);box-shadow:0 1px 0 #d8e2f7}
.faq button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:14px;padding:16px;border:0;border-radius:12px;background:none;color:var(--ink);font:700 14px/1.35 inherit;font-family:inherit;text-align:left;cursor:pointer}
.faq button::after{content:"+";flex:none;color:var(--blue);font-size:22px;font-weight:600;line-height:1}
.faq button[aria-expanded=true]::after{content:"–"}
.faq p{margin:0;padding:0 16px 16px;font-size:13.5px}
footer{padding:0 16px 40px;text-align:center;font-size:12px}
footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style>
</head>
<body>

<section>
  <div class="wrap">
    <div class="badge" id="badge"></div>
    <h1 id="headline"></h1>
    <p class="lead" id="lead"></p>
    <div class="video" id="video">Видео орны</div>
    <a class="btn" href="#price"><span data-cta></span><span class="sticker" data-price></span></a>
    <p class="under" id="underCta"></p>
  </div>
</section>

<section class="soft">
  <div class="wrap">
    <h2 id="featuresTitle"></h2>
    <div class="features" id="features"></div>
    <a class="btn" href="#price" data-cta></a>
  </div>
</section>

<section id="price">
  <div class="wrap">
    <h2 class="center" id="priceTitle"></h2>
    <div class="pack">
      <h3 id="packageName"></h3>
      <div id="items"></div>
      <div class="total">Жалпы құны <s id="total"></s></div>
      <div class="price" data-price></div>
      <div class="timer" id="timer" hidden><span id="timerLabel"></span><b id="clock">00:00</b></div>
      <form class="promo" id="promo" hidden>
        <input id="promoInput" placeholder="Промокод" aria-label="Промокод" maxlength="24" autocomplete="off">
        <button type="submit">Қолдану</button>
      </form>
      <p class="promo-msg" id="promoMsg" role="status"></p>
      <div class="note" id="note" hidden></div>
      <a class="btn" id="buy" target="_blank" rel="noopener"></a>
      <p class="terms">Төлем жасау арқылы <a id="oferta1">жария оферта</a> шарттарын қабылдайсыз</p>
    </div>
  </div>
</section>

<section class="soft">
  <div class="wrap">
    <h2 class="center">Жиі сұрақтар</h2>
    <div class="faq" id="faq"></div>
    <a class="btn" href="#price" data-cta></a>
  </div>
</section>
<footer class="soft"><a id="oferta2">Жария оферта</a></footer>

<script src="config.js"></script>
<script>
(function () {
  var C = window.LANDING, $ = function (id) { return document.getElementById(id); };
  function el(tag, text, cls) { var e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
  function money(n) { return String(n).replace(/\B(?=(\d{3})+$)/g, " ") + " " + C.currency; }
  function lines(node, arr) { [].concat(arr).forEach(function (t) { node.appendChild(el("span", t)); }); }

  document.title = C.pageTitle;
  $("badge").textContent = C.badge;
  lines($("headline"), C.headline);
  $("lead").textContent = C.lead;
  $("underCta").textContent = C.underCta;
  lines($("featuresTitle"), C.featuresTitle);
  lines($("priceTitle"), C.priceTitle);
  $("packageName").textContent = C.packageName;
  document.querySelectorAll("[data-cta]").forEach(function (n) { n.textContent = C.ctaText; });
  document.querySelectorAll("[data-price]").forEach(function (n) { n.textContent = money(C.price); });
  ["oferta1", "oferta2"].forEach(function (id) { $(id).href = C.ofertaUrl; });

  // Видео
  var v = (C.video || "").trim(), yt = v.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
  if (yt) {
    $("video").innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + yt[1] + '" title="Видео" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>';
  } else if (v) {
    var vid = el("video"); vid.src = v; vid.controls = true; vid.playsInline = true; vid.preload = "metadata";
    $("video").textContent = ""; $("video").appendChild(vid);
  }

  C.features.forEach(function (f, i) {
    var d = el("div", null, "feature"), b = el("b");
    b.appendChild(el("i", String(i + 1).padStart(2, "0"))); b.appendChild(document.createTextNode(f.title));
    d.appendChild(b); d.appendChild(el("p", f.text)); $("features").appendChild(d);
  });

  var total = 0;
  C.items.forEach(function (it) {
    total += it.value;
    var r = el("div", null, "row"); r.appendChild(el("span", it.name)); r.appendChild(el("span", money(it.value)));
    $("items").appendChild(r);
  });
  $("total").textContent = money(total);
  if (total <= C.price) $("total").parentNode.hidden = true;

  if (C.note) { $("note").textContent = C.note; $("note").hidden = false; }

  // Сатып алу батырмасы → бот. Промокод /start параметрімен беріледі, жеңілдікті бот есептейді.
  var promo = "";
  function setBuy() {
    $("buy").textContent = C.buyText;
    $("buy").href = "https://t.me/" + C.botUsername + "?start=" + (promo ? "promo_" + promo : "buy");
  }
  setBuy();
  if (C.promoEnabled) {
    $("promo").hidden = false;
    $("promo").addEventListener("submit", function (e) {
      e.preventDefault();
      var code = $("promoInput").value.trim().toUpperCase(), ok = /^[A-Z0-9_-]{2,24}$/.test(code);
      promo = ok ? code : "";
      $("promoMsg").className = "promo-msg" + (ok ? "" : " err");
      $("promoMsg").textContent = ok ? "Промокод «" + code + "» сақталды — жеңілдік ботта есептеледі." : "Промокод тек латын әріптері мен цифрлардан тұрады.";
      setBuy();
    });
  }

  // Таймер
  var end = 0;
  if (C.deadline) end = new Date(C.deadline).getTime();
  else if (C.timerMinutes > 0) {
    try { end = +localStorage.getItem("landingTimerEnd"); } catch (e) {}
    if (!end) { end = Date.now() + C.timerMinutes * 60000; try { localStorage.setItem("landingTimerEnd", end); } catch (e) {} }
  }
  if (end) {
    $("timerLabel").textContent = C.timerLabel; $("timer").hidden = false;
    var p = function (n) { return String(n).padStart(2, "0"); };
    (function tick() {
      var s = Math.max(0, Math.floor((end - Date.now()) / 1000)), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600);
      $("clock").textContent = (d ? d + " күн " : "") + (d || h ? p(h) + ":" : "") + p(Math.floor(s % 3600 / 60)) + ":" + p(s % 60);
      if (s) setTimeout(tick, 1000);
    })();
  }

  // Жиі сұрақтар
  C.faq.forEach(function (f, i) {
    var d = el("div"), b = el("button", f.q), a = el("p", f.a);
    b.type = "button"; a.id = "faq" + i; b.setAttribute("aria-controls", a.id);
    function set(open) { b.setAttribute("aria-expanded", open); a.hidden = !open; }
    set(i === 0);
    b.addEventListener("click", function () { set(b.getAttribute("aria-expanded") !== "true"); });
    d.appendChild(b); d.appendChild(a); $("faq").appendChild(d);
  });
})();
</script>
</body>
</html>
