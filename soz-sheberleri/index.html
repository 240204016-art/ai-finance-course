<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сөз шеберлері</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one narrow column — header with live score, a yurt roadmap of 4 stages, one white stage card, steppe footer. Single bright light theme by design. */
:root {
  --sky: #e9f4fb;
  --sky-deep: #cfe6f4;
  --card: #ffffff;
  --ink: #17344a;
  --ink-soft: #557089;
  --blue: #1f8ac0;
  --blue-dark: #166a95;
  --blue-tint: #e3f2fa;
  --gold: #e0a100;
  --gold-dark: #a87700;
  --gold-tint: #fff4d6;
  --ok: #23a455;
  --ok-tint: #e3f7ea;
  --bad: #d93b3b;
  --bad-tint: #fde8e8;
  --line: #d6e6f0;
  --hill-1: #bfe0b4;
  --hill-2: #9fcf92;
  --f-display: "Rubik", "Trebuchet MS", "Segoe UI", Arial, sans-serif;
  --f-body: "PT Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --r: 18px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.wrap {
  width: 100%;
  max-width: 780px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3, .display { font-family: var(--f-display); text-wrap: balance; }

/* ---------- Header ---------- */
.top { padding-block: 22px 6px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { width: 46px; height: 46px; flex: none; }
.brand h1 { margin: 0; font-size: clamp(26px, 6vw, 36px); font-weight: 800; color: var(--blue-dark); letter-spacing: -0.01em; line-height: 1.05; }
.brand small { display: block; font-family: var(--f-body); font-size: 14px; color: var(--ink-soft); font-weight: 400; letter-spacing: 0.02em; }
.score-pill {
  display: inline-flex; align-items: baseline; gap: 6px;
  background: var(--gold); color: #fff;
  padding: 8px 18px; border-radius: 999px;
  font-family: var(--f-display); font-weight: 800; font-size: 22px;
  box-shadow: 0 3px 0 var(--gold-dark);
  font-variant-numeric: tabular-nums;
  transition: transform .2s;
}
.score-pill span { font-size: 15px; font-weight: 500; }
.score-pill.bump { transform: scale(1.12); }

/* ---------- Roadmap ---------- */
.map { position: relative; margin: 18px 0 8px; }
.map ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; position: relative; z-index: 1; }
.map-path { position: absolute; left: 12.5%; right: 12.5%; top: 31px; height: 0; border-top: 3px dashed var(--sky-deep); z-index: 0; }
.map-path i { position: absolute; left: 0; top: -3px; height: 3px; background: var(--ok); width: 0; transition: width .5s; }
.stop { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; min-width: 0; }
.yurt {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--card); border: 3px solid var(--line);
  display: grid; place-items: center; color: #9db4c4;
  transition: border-color .3s, background .3s, color .3s, box-shadow .3s;
}
.yurt svg { width: 38px; height: 38px; }
.stop-num { font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.stop-name { font-size: 14px; line-height: 1.2; color: var(--ink-soft); font-weight: 700; }
.stop.current .yurt { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 0 5px rgba(31,138,192,.18); }
.stop.current .stop-name { color: var(--blue-dark); }
.stop.done .yurt { border-color: var(--ok); background: var(--ok); color: #fff; }
.stop.done .stop-name { color: var(--ok); }

/* ---------- Card ---------- */
main { flex: 1; padding-block: 10px 28px; }
.card {
  background: var(--card); border-radius: 24px;
  padding: clamp(20px, 4.5vw, 36px);
  box-shadow: 0 2px 0 var(--line), 0 12px 32px rgba(23,52,74,.08);
  animation: rise .35s ease-out;
}
@keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
.eyebrow { font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-dark); margin: 0 0 6px; }
.card h2 { margin: 0 0 10px; font-size: clamp(22px, 5vw, 30px); font-weight: 700; line-height: 1.15; }
.lead { margin: 0 0 22px; color: var(--ink-soft); max-width: 60ch; }
.progress { display: flex; gap: 6px; margin: 0 0 18px; }
.progress b { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.progress b.ok { background: var(--ok); }
.progress b.bad { background: var(--bad); }
.progress b.now { background: var(--blue); }

/* ---------- Buttons & inputs ---------- */
.btn {
  appearance: none; border: 0; cursor: pointer;
  font-family: var(--f-display); font-weight: 700; font-size: 17px;
  min-height: 54px; padding: 0 26px; border-radius: 16px;
  background: var(--blue); color: #fff;
  box-shadow: 0 4px 0 var(--blue-dark);
  transition: transform .08s, box-shadow .08s, background .2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  touch-action: manipulation;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-dark); }
.btn:focus-visible, .opt:focus-visible, .tile:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn.gold { background: var(--gold); box-shadow: 0 4px 0 var(--gold-dark); }
.btn.gold:active { box-shadow: 0 1px 0 var(--gold-dark); }
.btn.ghost { background: var(--blue-tint); color: var(--blue-dark); box-shadow: 0 4px 0 #bcdcee; }
.btn.ghost:active { box-shadow: 0 1px 0 #bcdcee; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
.btn-row .btn { flex: 1 1 140px; }
label.field { display: block; font-weight: 700; margin-bottom: 8px; }
.text-in {
  width: 100%; font: inherit; font-size: 18px; color: var(--ink);
  min-height: 56px; padding: 12px 16px; border-radius: 14px;
  border: 2px solid var(--line); background: #f7fbfe;
}
.text-in:focus { border-color: var(--blue); background: #fff; }
textarea.text-in { min-height: 220px; resize: vertical; line-height: 1.55; }
.hint { font-size: 14px; color: var(--ink-soft); margin-top: 8px; }

/* ---------- Start screen ---------- */
.start-steps { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 0 0 24px; padding: 0; list-style: none; }
.start-steps li { background: var(--blue-tint); border-radius: 14px; padding: 12px 14px; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
.start-steps li b { font-family: var(--f-display); color: var(--blue-dark); font-weight: 700; }
.start-steps li span { color: var(--gold-dark); font-weight: 700; white-space: nowrap; }
.start-form { display: grid; gap: 14px; }
.error { color: var(--bad); font-weight: 700; font-size: 15px; min-height: 1.2em; margin: 0; }

/* ---------- Stage 1 ---------- */
.clue { font-size: 19px; line-height: 1.5; margin: 0 0 20px; padding: 18px 20px; border-radius: 16px; background: var(--gold-tint); border-left: 0; }
.clue em { color: var(--ink-soft); }
.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.opt {
  appearance: none; font-family: var(--f-display); font-weight: 500; font-size: 18px;
  min-height: 60px; padding: 10px 14px; border-radius: 16px; cursor: pointer;
  background: #fff; color: var(--ink); border: 2px solid var(--line);
  box-shadow: 0 3px 0 var(--line);
  transition: border-color .15s, background .15s;
  touch-action: manipulation;
}
.opt:hover:not(:disabled) { border-color: var(--blue); }
.opt:disabled { cursor: default; }
.opt.right { background: var(--ok); border-color: var(--ok); color: #fff; box-shadow: 0 3px 0 #17803f; }
.opt.wrong { background: var(--bad); border-color: var(--bad); color: #fff; box-shadow: 0 3px 0 #a52626; }
.opt.dim { opacity: .55; }
.feedback { margin: 18px 0 0; padding: 14px 18px; border-radius: 14px; font-weight: 700; font-size: 17px; }
.feedback.ok { background: var(--ok-tint); color: #137a3b; }
.feedback.bad { background: var(--bad-tint); color: #a52626; }
.feedback.info { background: var(--blue-tint); color: var(--blue-dark); }

/* ---------- Stage 2 ---------- */
.definition { font-size: 19px; margin: 0 0 22px; }
.slots { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 0 0 22px; }
.slot {
  width: clamp(38px, 10vw, 52px); height: clamp(46px, 12vw, 60px);
  border-radius: 12px; border: 2px dashed #a9cbe0; background: #f7fbfe;
  display: grid; place-items: center;
  font-family: var(--f-display); font-weight: 800; font-size: clamp(20px, 5.5vw, 28px); color: var(--blue-dark);
}
.slot.filled { border-style: solid; border-color: var(--blue); background: var(--blue-tint); }
.slots.ok .slot { border-color: var(--ok); background: var(--ok); color: #fff; }
.slots.bad .slot.filled { border-color: var(--bad); background: var(--bad-tint); color: var(--bad); animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tile {
  appearance: none; cursor: pointer;
  width: clamp(48px, 13vw, 62px); height: clamp(52px, 14vw, 64px);
  border-radius: 14px; border: 0;
  background: var(--gold); color: #fff;
  font-family: var(--f-display); font-weight: 800; font-size: clamp(22px, 6vw, 28px);
  box-shadow: 0 4px 0 var(--gold-dark);
  touch-action: manipulation;
}
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }
.tile.used { visibility: hidden; }

/* ---------- Stage 3 ---------- */
.gen-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.timer {
  font-family: var(--f-display); font-weight: 800; font-size: 30px; font-variant-numeric: tabular-nums;
  color: var(--blue-dark); background: var(--blue-tint); border-radius: 14px; padding: 4px 16px;
  display: inline-flex; align-items: center; gap: 8px;
}
.timer svg { width: 22px; height: 22px; }
.timer.low { color: #fff; background: var(--bad); }
.timer.idle { color: var(--ink-soft); }
.combo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 0 16px; }
.combo-card {
  border-radius: 16px; padding: 14px 12px; text-align: center; min-width: 0;
  background: var(--blue-tint); border: 2px solid #bcdcee;
}
.combo-card small { display: block; font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 4px; }
.combo-card strong { display: block; font-family: var(--f-display); font-weight: 700; font-size: 18px; line-height: 1.2; color: var(--blue-dark); overflow-wrap: anywhere; }
.combo-card:nth-child(4) { background: var(--gold-tint); border-color: #f1d48a; }
.combo-card:nth-child(4) strong { color: var(--gold-dark); }
.combo.spin .combo-card { animation: flip .4s ease; }
@keyframes flip { 0% { transform: rotateX(90deg); } 100% { transform: none; } }
.task { margin: 0 0 14px; font-weight: 700; }
.counter { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--ink-soft); margin-top: 8px; }
.story { white-space: pre-wrap; background: #f7fbfe; border: 2px solid var(--line); border-radius: 16px; padding: 16px 18px; margin: 0 0 18px; font-size: 17px; max-height: 320px; overflow: auto; overflow-wrap: anywhere; }
.story.empty { color: var(--ink-soft); font-style: italic; }
.crit { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.crit li { display: grid; grid-template-columns: 40px 1fr auto; align-items: start; gap: 12px; padding: 14px; border-radius: 16px; border: 2px solid var(--line); }
.crit .mark { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 20px; }
.crit .mark.ok { background: var(--ok); color: #fff; }
.crit .mark.bad { background: var(--bad); color: #fff; }
.crit .crit-body { min-width: 0; }
.crit .crit-body b { display: block; }
.crit .crit-body small { color: var(--ink-soft); font-size: 14px; display: block; margin-top: 2px; }
.crit .pts { font-family: var(--f-display); font-weight: 700; color: var(--gold-dark); white-space: nowrap; font-variant-numeric: tabular-nums; }
.crit li.manual { cursor: pointer; }
.crit li.manual.checked { border-color: var(--ok); background: var(--ok-tint); }
.check { width: 40px; height: 40px; border-radius: 12px; border: 2px solid #a9cbe0; display: grid; place-items: center; background: #fff; color: transparent; font-size: 22px; font-weight: 800; }
.crit li.manual.checked .check { background: var(--ok); border-color: var(--ok); color: #fff; }
.crit input[type=checkbox] { position: absolute; opacity: 0; pointer-events: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.chip.ok { background: var(--ok-tint); color: #137a3b; }
.chip.bad { background: var(--bad-tint); color: #a52626; }
.sum { margin-top: 16px; text-align: right; font-family: var(--f-display); font-weight: 700; font-size: 20px; }
.sum b { color: var(--gold-dark); }

/* ---------- Stage 4 ---------- */
.theme-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--gold-tint); color: var(--gold-dark); border-radius: 999px; padding: 6px 16px; font-family: var(--f-display); font-weight: 700; margin-bottom: 18px; }
.cq-lines { display: grid; gap: 14px; }
.cq-line { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; }
.cq-n { width: 44px; height: 44px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 18px; }
.cq-line label { display: block; font-size: 14px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 700; }
.cq-line .text-in { min-height: 52px; }
.poem { text-align: center; margin: 4px 0 18px; padding: 22px 16px; border-radius: 20px; background: linear-gradient(180deg, var(--gold-tint), #fff); border: 2px solid #f1d48a; }
.poem p { margin: 0; padding: 4px 0; font-size: 20px; line-height: 1.4; overflow-wrap: anywhere; }
.poem p:first-child { font-family: var(--f-display); font-weight: 700; font-size: 26px; color: var(--blue-dark); }
.poem p.badline { color: var(--bad); }
.poem p.badline::after { content: attr(data-need); display: block; font-size: 13px; font-weight: 700; font-family: var(--f-body); }
.poem p:last-child { font-family: var(--f-display); font-weight: 700; color: var(--gold-dark); }
.poem p:last-child.badline { color: var(--bad); }
.line-scores { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 8px; }
.line-scores div { text-align: center; padding: 8px 4px; border-radius: 12px; font-size: 14px; font-weight: 700; }
.line-scores .ok { background: var(--ok-tint); color: #137a3b; }
.line-scores .bad { background: var(--bad-tint); color: #a52626; }

/* ---------- Final ---------- */
.final { text-align: center; }
.final .team { font-family: var(--f-display); font-weight: 700; font-size: 20px; color: var(--ink-soft); margin: 0 0 4px; }
.big { font-family: var(--f-display); font-weight: 800; font-size: clamp(64px, 18vw, 104px); line-height: 1; color: var(--blue-dark); margin: 6px 0 14px; font-variant-numeric: tabular-nums; }
.big span { font-size: .4em; color: var(--ink-soft); font-weight: 700; }
.badge {
  display: inline-flex; align-items: center; gap: 10px;
  background: linear-gradient(180deg, #f6c33a, var(--gold));
  color: #fff; border-radius: 999px; padding: 12px 26px;
  font-family: var(--f-display); font-weight: 800; font-size: 22px;
  box-shadow: 0 4px 0 var(--gold-dark), 0 10px 24px rgba(224,161,0,.35);
  text-shadow: 0 1px 0 rgba(0,0,0,.15);
}
.badge svg { width: 28px; height: 28px; }
.stage-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 28px 0 0; }
.stage-card { background: var(--blue-tint); border-radius: 16px; padding: 14px 8px; min-width: 0; }
.stage-card small { display: block; font-size: 13px; color: var(--ink-soft); font-weight: 700; line-height: 1.25; min-height: 2.5em; }
.stage-card strong { display: block; font-family: var(--f-display); font-weight: 800; font-size: 24px; color: var(--blue-dark); font-variant-numeric: tabular-nums; margin-top: 6px; }
.stage-card strong span { font-size: 14px; color: var(--ink-soft); font-weight: 500; }
.copy-fallback { width: 100%; margin-top: 14px; min-height: 160px; font-size: 15px; }

/* ---------- Footer ---------- */
footer { position: relative; margin-top: auto; }
.hills { display: block; width: 100%; height: 70px; }
.foot-band { background: var(--hill-2); padding-block: 0 18px; }
.foot-band p { margin: 0; text-align: center; font-size: 14px; color: #24502a; font-weight: 700; }

/* ---------- Responsive ---------- */
@media (max-width: 600px) {
  body { font-size: 16px; }
  .opts { grid-template-columns: 1fr; }
  .combo { grid-template-columns: repeat(2, 1fr); }
  .stage-cards { grid-template-columns: repeat(2, 1fr); }
  .start-steps { grid-template-columns: 1fr; }
  .yurt { width: 54px; height: 54px; }
  .yurt svg { width: 32px; height: 32px; }
  .map-path { top: 26px; }
  .stop-name { font-size: 12px; }
  .stop-num { font-size: 11px; }
  .line-scores div { font-size: 12px; }
  .crit li { grid-template-columns: 36px 1fr; }
  .crit .pts { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    </symbol>
  </defs>
</svg>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="23" fill="#1f8ac0"/>
          <path d="M24 9 c-5 0-8 3-8 6.5 s3 5 5 3.5 M24 9 c5 0 8 3 8 6.5 s-3 5-5 3.5 M24 39 c-5 0-8-3-8-6.5 s3-5 5-3.5 M24 39 c5 0 8-3 8-6.5 s-3-5-5-3.5 M24 13 V35" fill="none" stroke="#e0a100" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <h1>Сөз шеберлері<small>Әдеби квест</small></h1>
      </div>
      <div class="score-pill" id="scorePill" aria-live="polite"><b id="scoreNum">0</b><span>ұпай</span></div>
    </div>
    <nav class="map" aria-label="Кезеңдер картасы">
      <div class="map-path"><i id="mapFill"></i></div>
      <ol id="map"></ol>
    </nav>
  </div>
</header>

<main>
  <div class="wrap" id="app"></div>
</main>

<footer>
  <svg class="hills" viewBox="0 0 800 70" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 50 Q120 10 260 38 T520 30 T800 36 V70 H0Z" fill="#bfe0b4"/>
    <path d="M0 62 Q160 34 330 54 T640 48 T800 52 V70 H0Z" fill="#9fcf92"/>
  </svg>
  <div class="foot-band">
    <div class="wrap"><p>Қазақ әдебиеті бойынша шығармашылық онлайн ойын · 4 кезең · ең жоғары нәтиже 180 ұпай</p></div>
  </div>
</footer>

<script>
(function () {
  "use strict";

  // ---------------- Деректер ----------------
  var STAGES = [
    { name: "Кейіпкерді тап", max: 60 },
    { name: "Сөз құрастыр", max: 60 },
    { name: "Шығармашылық генератор", max: 30 },
    { name: "Синквейн", max: 30 }
  ];
  var MAX_TOTAL = 180;

  var QUIZ = [
    { q: "Ақ әскерлердің қолына түсіп, қорлық көрген, кейін білім алып, жаңа өмір бастаған қыз.", src: "Ж. Аймауытов", opts: ["Ақбілек", "Жамал", "Қамар", "Шұға"], a: "Ақбілек" },
    { q: "Әкесінің шешімімен сүймеген адамға айттырылып, сүйгені Ғалыммен қосыла алмай, қайғылы тағдырға ұшыраған қыз.", src: "М. Дулатұлы", opts: ["Баян", "Жамал", "Ақбілек", "Қыз Жібек"], a: "Жамал" },
    { q: "Бөлтірік кезінде адамдар асырап алған, бірақ табиғатына тартып, өзін асыраған балаға шабуыл жасаған көкжал.", src: "М. Әуезов", opts: ["Ақтөс", "Көксерек", "Қасқыр", "Бөрібай"], a: "Көксерек" },
    { q: "Төлеген ғашық болып, алыс жерден іздеп келген, Жайық бойындағы сұлу қыз.", src: "Лиро-эпостық жыр", opts: ["Қыз Жібек", "Баян сұлу", "Қамар", "Ақбілек"], a: "Қыз Жібек" },
    { q: "Қозы Көрпешке бесікте атастырылған, оған өле-өлгенше адал болған сұлу.", src: "Лиро-эпостық жыр", opts: ["Шұға", "Жамал", "Баян сұлу", "Қыз Жібек"], a: "Баян сұлу" },
    { q: "Абай өлеңінде «ақ киімді, денелі, ақ сақалды» шал бейнесінде кейіптелген табиғат құбылысы.", src: "", opts: ["Күз", "Қыс", "Жаз", "Көктем"], a: "Қыс" }
  ];

  var WORDS = [
    { w: "ТЕҢЕУ", d: "Бір затты екінші затқа салыстыру арқылы бейнелеу («айдай сұлу»)." },
    { w: "ЭПИТЕТ", d: "Заттың көркем, бейнелі анықтамасы («алтын күз»)." },
    { w: "ШУМАҚ", d: "Өлеңнің бірнеше жолдан тұратын бөлігі." },
    { w: "ҰЙҚАС", d: "Өлең жолдарының соңындағы дыбыстық үндестік." },
    { w: "КЕЙІПТЕУ", d: "Жансыз затты адамша сөйлетіп, әрекет еткізу." },
    { w: "МЕТАФОРА", d: "Ауыспалы мағынада қолданылған жасырын салыстыру." }
  ];

  // k — мәтіннен іздейтін түбірлер (сөз басынан, кез келген жалғаумен)
  var GEN = {
    hero: [
      { t: "Ақбілек", k: ["ақбіле"] }, { t: "Көксерек", k: ["көксерек"] }, { t: "Қыз Жібек", k: ["жібек"] },
      { t: "Абай", k: ["абай"] }, { t: "қазіргі студент", k: ["студент"] }, { t: "қарт жырау", k: ["жырау"] }
    ],
    place: [
      { t: "қысқы дала", k: ["дала"] }, { t: "қала кітапханасы", k: ["кітапхана"] }, { t: "таудағы ауыл", k: ["ауыл"] },
      { t: "поезд вагоны", k: ["поезд", "вагон"] }, { t: "ескі мектеп", k: ["мектеп"] }, { t: "Жайық жағасы", k: ["жайық"] }
    ],
    item: [
      { t: "ескі домбыра", k: ["домбыр"] }, { t: "жоғалған хат", k: ["хат"] }, { t: "сиқырлы қалам", k: ["қалам"] },
      { t: "күнделік", k: ["күнделі"] }, { t: "кілт", k: ["кілт"] }, { t: "қасқырдың ізі", k: ["қасқыр"] }
    ],
    genre: ["ертегі", "детектив", "фантастика", "аңыз", "күлкілі әңгіме", "драма"]
  };

  var TOPICS = ["Абай", "Дала", "Махаббат", "Ақбілек", "Кітап", "Ана"];
  var CQ = [
    { need: 1, label: "1-жол · тақырып (1 зат есім)", ph: "" },
    { need: 2, label: "2-жол · 2 сын есім", ph: "мысалы: дана, ойшыл" },
    { need: 3, label: "3-жол · 3 етістік", ph: "мысалы: ойлайды, жазады, үйретеді" },
    { need: 4, label: "4-жол · 4 сөзден тұратын сөйлем", ph: "мысалы: Оның сөзі мәңгі жасайды" },
    { need: 1, label: "5-жол · 1 сөз, синоним немесе түйін", ph: "мысалы: Хакім" }
  ];

  // ---------------- Күй ----------------
  var S = { team: "", stage: -1, scores: [0, 0, 0, 0], done: [false, false, false, false] };
  var timerId = null;

  var app = document.getElementById("app");

  // ---------------- Көмекші ----------------
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(n) { return (Math.round(n * 10) / 10).toString().replace(".", ","); }
  function total() { return S.scores.reduce(function (a, b) { return a + b; }, 0); }
  function words(s) { return s.trim().split(/\s+/).filter(function (w) { return /\p{L}|\d/u.test(w); }); }
  function lower(s) { try { return s.toLocaleLowerCase("kk"); } catch (e) { return s.toLowerCase(); } }
  function hasStem(text, stem) { return new RegExp("(^|[^\\p{L}])" + stem, "u").test(text); }
  function sentences(s) { return s.split(/[.!?…]+/).filter(function (x) { return /\p{L}/u.test(x); }); }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

  function setScore(stageIdx, val) {
    S.scores[stageIdx] = val;
    var pill = document.getElementById("scorePill");
    document.getElementById("scoreNum").textContent = fmt(total());
    pill.classList.remove("bump"); void pill.offsetWidth; pill.classList.add("bump");
    setTimeout(function () { pill.classList.remove("bump"); }, 220);
  }
  function addScore(stageIdx, d) { setScore(stageIdx, S.scores[stageIdx] + d); }

  function renderMap() {
    var html = "";
    STAGES.forEach(function (st, i) {
      var cls = S.done[i] ? "done" : (S.stage === i ? "current" : "");
      html += '<li class="stop ' + cls + '"' + (S.stage === i ? ' aria-current="step"' : "") + '>' +
        '<div class="yurt"><svg aria-hidden="true"><use href="#' + (S.done[i] ? "i-check" : "i-yurt") + '"/></svg></div>' +
        '<div class="stop-num">' + (i + 1) + '-кезең</div>' +
        '<div class="stop-name">' + st.name + '</div></li>';
    });
    document.getElementById("map").innerHTML = html;
    var doneCount = S.done.filter(Boolean).length;
    document.getElementById("mapFill").style.width = (Math.min(doneCount, 3) / 3 * 100) + "%";
  }

  function view(html) {
    stopTimer();
    app.innerHTML = '<section class="card">' + html + '</section>';
    renderMap();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function finishStage(i) {
    S.done[i] = true;
    if (i < 3) startStage(i + 1); else showFinal();
  }

  function startStage(i) {
    S.stage = i;
    [stage1, stage2, stage3, stage4][i]();
  }

  // ---------------- Бастапқы экран ----------------
  function showStart() {
    S = { team: S.team || "", stage: -1, scores: [0, 0, 0, 0], done: [false, false, false, false] };
    document.getElementById("scoreNum").textContent = "0";
    var steps = STAGES.map(function (st, i) { return '<li><b>' + (i + 1) + '. ' + st.name + '</b><span>' + st.max + ' ұпай</span></li>'; }).join("");
    view(
      '<p class="eyebrow">Дала квесті · 180 ұпай</p>' +
      '<h2>Әдеби квестке қош келдіңіз!</h2>' +
      '<p class="lead">Командаңыз төрт кезеңнен өтеді: кейіпкерді табасыз, әдеби терминді құрастырасыз, шағын әңгіме жазасыз және синквейн шығарасыз.</p>' +
      '<ul class="start-steps">' + steps + '</ul>' +
      '<form class="start-form" id="startForm" novalidate>' +
        '<div><label class="field" for="teamName">Команда атауы</label>' +
        '<input class="text-in" id="teamName" maxlength="40" autocomplete="off" placeholder="мысалы: Абай ізбасарлары" value="' + esc(S.team) + '"></div>' +
        '<p class="error" id="startErr" role="alert"></p>' +
        '<button class="btn gold" type="submit">Ойынды бастау</button>' +
      '</form>'
    );
    document.getElementById("startForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = document.getElementById("teamName").value.trim();
      if (!name) { document.getElementById("startErr").textContent = "Команда атауын жазыңыз."; document.getElementById("teamName").focus(); return; }
      S.team = name;
      startStage(0);
    });
  }

  // ---------------- 1-кезең ----------------
  function stage1() {
    var idx = 0, results = [];
    function render() {
      var item = QUIZ[idx];
      var opts = shuffle(item.opts);
      var bars = QUIZ.map(function (_, i) { return '<b class="' + (results[i] === true ? "ok" : results[i] === false ? "bad" : i === idx ? "now" : "") + '"></b>'; }).join("");
      view(
        '<p class="eyebrow">1-кезең · ' + (idx + 1) + ' / ' + QUIZ.length + ' сұрақ</p>' +
        '<h2>Кейіпкерді тап</h2>' +
        '<div class="progress" aria-hidden="true">' + bars + '</div>' +
        '<p class="clue">' + esc(item.q) + (item.src ? ' <em>(' + esc(item.src) + ')</em>' : "") + '</p>' +
        '<div class="opts" id="opts">' + opts.map(function (o) { return '<button class="opt" type="button" data-v="' + esc(o) + '">' + esc(o) + '</button>'; }).join("") + '</div>' +
        '<div id="fb" aria-live="polite"></div>' +
        '<div class="btn-row" id="nextRow" hidden><button class="btn" id="nextBtn" type="button">' + (idx < QUIZ.length - 1 ? "Келесі" : "2-кезеңге өту") + '</button></div>'
      );
      var box = document.getElementById("opts");
      box.addEventListener("click", function (e) {
        var b = e.target.closest(".opt"); if (!b || b.disabled) return;
        var v = b.getAttribute("data-v"), ok = v === item.a;
        box.querySelectorAll(".opt").forEach(function (o) {
          o.disabled = true;
          if (o.getAttribute("data-v") === item.a) o.classList.add("right");
          else if (o === b) o.classList.add("wrong");
          else o.classList.add("dim");
        });
        results[idx] = ok;
        if (ok) addScore(0, 10);
        document.getElementById("fb").innerHTML = ok
          ? '<p class="feedback ok">Дұрыс! +10 ұпай</p>'
          : '<p class="feedback bad">Қате. Дұрыс жауап: ' + esc(item.a) + '</p>';
        document.getElementById("nextRow").hidden = false;
        document.getElementById("nextBtn").focus();
      });
      document.getElementById("nextBtn").addEventListener("click", function () {
        idx++;
        if (idx < QUIZ.length) render(); else finishStage(0);
      });
    }
    render();
  }

  // ---------------- 2-кезең ----------------
  function stage2() {
    var idx = 0, results = [];
    function render() {
      var item = WORDS[idx];
      var letters = Array.from(item.w);
      var mixed;
      do { mixed = shuffle(letters); } while (mixed.join("") === item.w && letters.length > 1);
      var picked = []; // tile indices
      var solved = false;
      var bars = WORDS.map(function (_, i) { return '<b class="' + (results[i] === true ? "ok" : results[i] === false ? "bad" : i === idx ? "now" : "") + '"></b>'; }).join("");
      view(
        '<p class="eyebrow">2-кезең · ' + (idx + 1) + ' / ' + WORDS.length + ' сөз</p>' +
        '<h2>Сөз құрастыр</h2>' +
        '<div class="progress" aria-hidden="true">' + bars + '</div>' +
        '<p class="definition">' + esc(item.d) + '</p>' +
        '<div class="slots" id="slots" aria-live="polite">' + letters.map(function () { return '<span class="slot"></span>'; }).join("") + '</div>' +
        '<div class="tiles" id="tiles">' + mixed.map(function (l, i) { return '<button class="tile" type="button" data-i="' + i + '" aria-label="Әріп ' + l + '">' + l + '</button>'; }).join("") + '</div>' +
        '<div id="fb" aria-live="polite"></div>' +
        '<div class="btn-row" id="ctrl">' +
          '<button class="btn ghost" id="delBtn" type="button">Өшіру</button>' +
          '<button class="btn" id="chkBtn" type="button">Тексеру</button>' +
          '<button class="btn ghost" id="skipBtn" type="button">Өткізу</button>' +
        '</div>' +
        '<div class="btn-row" id="nextRow" hidden><button class="btn" id="nextBtn" type="button">' + (idx < WORDS.length - 1 ? "Келесі" : "3-кезеңге өту") + '</button></div>'
      );
      var slotsEl = document.getElementById("slots"), tilesEl = document.getElementById("tiles"), fb = document.getElementById("fb");
      function paint() {
        var s = slotsEl.children;
        for (var i = 0; i < s.length; i++) {
          var ch = picked[i] !== undefined ? mixed[picked[i]] : "";
          s[i].textContent = ch; s[i].classList.toggle("filled", !!ch);
        }
        tilesEl.querySelectorAll(".tile").forEach(function (t) { t.classList.toggle("used", picked.indexOf(+t.getAttribute("data-i")) !== -1); });
        slotsEl.classList.remove("bad");
      }
      function end(ok) {
        solved = true;
        results[idx] = ok;
        document.getElementById("ctrl").hidden = true;
        document.getElementById("nextRow").hidden = false;
        tilesEl.querySelectorAll(".tile").forEach(function (t) { t.disabled = true; });
        document.getElementById("nextBtn").focus();
      }
      tilesEl.addEventListener("click", function (e) {
        var t = e.target.closest(".tile"); if (!t || solved) return;
        var i = +t.getAttribute("data-i"); if (picked.indexOf(i) !== -1) return;
        if (picked.length >= letters.length) return;
        picked.push(i); fb.innerHTML = ""; paint();
      });
      document.getElementById("delBtn").addEventListener("click", function () { if (solved) return; picked.pop(); fb.innerHTML = ""; paint(); });
      document.getElementById("chkBtn").addEventListener("click", function () {
        if (solved) return;
        if (picked.length < letters.length) { fb.innerHTML = '<p class="feedback info">Барлық әріпті қолданыңыз: сөзде ' + letters.length + ' әріп бар.</p>'; return; }
        var guess = picked.map(function (i) { return mixed[i]; }).join("");
        if (guess === item.w) {
          slotsEl.classList.add("ok");
          addScore(1, 10);
          fb.innerHTML = '<p class="feedback ok">Тамаша! +10 ұпай</p>';
          end(true);
        } else {
          slotsEl.classList.remove("bad"); void slotsEl.offsetWidth; slotsEl.classList.add("bad");
          fb.innerHTML = '<p class="feedback bad">Әзірге дұрыс емес. «Өшіру» арқылы түзетіп, қайта тексеріңіз.</p>';
        }
      });
      document.getElementById("skipBtn").addEventListener("click", function () {
        if (solved) return;
        picked = letters.map(function (l) { return -1; });
        var s = slotsEl.children;
        for (var i = 0; i < s.length; i++) { s[i].textContent = letters[i]; s[i].classList.add("filled"); }
        tilesEl.querySelectorAll(".tile").forEach(function (t) { t.classList.add("used"); });
        fb.innerHTML = '<p class="feedback info">Дұрыс жауап: ' + item.w + '</p>';
        end(false);
      });
      document.getElementById("nextBtn").addEventListener("click", function () {
        idx++;
        if (idx < WORDS.length) render(); else finishStage(1);
      });
    }
    render();
  }

  // ---------------- 3-кезең ----------------
  function stage3() {
    var combo, story = "", left = 180, started = false, timeUp = false;
    function newCombo() { combo = { hero: pick(GEN.hero), place: pick(GEN.place), item: pick(GEN.item), genre: pick(GEN.genre) }; }
    newCombo();

    function comboHtml() {
      return '<div class="combo-card"><small>Кейіпкер</small><strong>' + esc(combo.hero.t) + '</strong></div>' +
        '<div class="combo-card"><small>Орын</small><strong>' + esc(combo.place.t) + '</strong></div>' +
        '<div class="combo-card"><small>Зат</small><strong>' + esc(combo.item.t) + '</strong></div>' +
        '<div class="combo-card"><small>Жанр</small><strong>' + esc(combo.genre) + '</strong></div>';
    }
    function clock(s) { return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }

    view(
      '<div class="gen-head"><div><p class="eyebrow">3-кезең · ең көбі 30 ұпай</p><h2 style="margin:0">Шығармашылық генератор</h2></div>' +
      '<div class="timer idle" id="timer" role="timer" aria-live="off"><svg aria-hidden="true"><use href="#i-clock"/></svg><span id="tval">3:00</span></div></div>' +
      '<div class="combo" id="combo">' + comboHtml() + '</div>' +
      '<p class="task">Осы төртеуін біріктіріп, 3 минутта кемінде 5 сөйлемнен тұратын шағын әңгіме жазыңыз.</p>' +
      '<label class="field" for="storyIn">Сіздің әңгімеңіз</label>' +
      '<textarea class="text-in" id="storyIn" placeholder="Жаза бастағанда таймер іске қосылады…"></textarea>' +
      '<div class="counter"><span id="cnt">0 сөйлем · 0 сөз</span><span id="tmsg">Таймер бірінші әріптен басталады</span></div>' +
      '<div class="btn-row">' +
        '<button class="btn ghost" id="reroll" type="button">Басқа жиынтық</button>' +
        '<button class="btn gold" id="doneBtn" type="button">Аяқтадым</button>' +
      '</div>'
    );
    var ta = document.getElementById("storyIn"), timerEl = document.getElementById("timer"), tval = document.getElementById("tval");

    document.getElementById("reroll").addEventListener("click", function () {
      if (started) return;
      newCombo();
      var c = document.getElementById("combo");
      c.innerHTML = comboHtml();
      c.classList.remove("spin"); void c.offsetWidth; c.classList.add("spin");
    });
    function tick() {
      left--;
      tval.textContent = clock(Math.max(left, 0));
      timerEl.classList.toggle("low", left <= 30);
      if (left <= 0) {
        stopTimer(); timeUp = true;
        ta.readOnly = true;
        document.getElementById("tmsg").textContent = "Уақыт бітті! «Аяқтадым» батырмасын басыңыз.";
        document.getElementById("tmsg").style.color = "var(--bad)";
      }
    }
    ta.addEventListener("input", function () {
      story = ta.value;
      if (!started && story.trim()) {
        started = true;
        timerEl.classList.remove("idle");
        document.getElementById("reroll").disabled = true;
        document.getElementById("tmsg").textContent = "Жазыңыз, уақыт жүріп жатыр";
        timerId = setInterval(tick, 1000);
      }
      document.getElementById("cnt").textContent = sentences(story).length + " сөйлем · " + words(story).length + " сөз";
    });
    document.getElementById("doneBtn").addEventListener("click", function () {
      story = ta.value;
      stopTimer();
      evaluate(combo, story, 180 - Math.max(left, 0), timeUp);
    });
  }

  function evaluate(combo, story, usedSec, timeUp) {
    var text = lower(story);
    var sCount = sentences(story).length;
    var c1 = sCount >= 5;
    var parts = [
      { lab: "Кейіпкер", el: combo.hero }, { lab: "Орын", el: combo.place }, { lab: "Зат", el: combo.item }
    ].map(function (p) { return { lab: p.lab, t: p.el.t, ok: p.el.k.some(function (k) { return hasStem(text, k); }) }; });
    var c2 = parts.every(function (p) { return p.ok; });
    var chips = parts.map(function (p) { return '<span class="chip ' + (p.ok ? "ok" : "bad") + '">' + (p.ok ? "✓ " : "✗ ") + esc(p.t) + '</span>'; }).join("");
    var mm = Math.floor(usedSec / 60) + ":" + ("0" + (usedSec % 60)).slice(-2);

    view(
      '<p class="eyebrow">3-кезең · бағалау</p>' +
      '<h2>Әңгімені бағалау</h2>' +
      '<p class="lead">Жиынтық: <b>' + esc(combo.hero.t) + '</b> · <b>' + esc(combo.place.t) + '</b> · <b>' + esc(combo.item.t) + '</b> · жанры <b>' + esc(combo.genre) + '</b>. Жұмсалған уақыт: ' + mm + (timeUp ? " (уақыт толық бітті)" : "") + '.</p>' +
      '<div class="story' + (story.trim() ? "" : " empty") + '">' + (story.trim() ? esc(story.trim()) : "Әңгіме жазылмады.") + '</div>' +
      '<ul class="crit" id="crit">' +
        '<li><div class="mark ' + (c1 ? "ok" : "bad") + '">' + (c1 ? "✓" : "✗") + '</div><div class="crit-body"><b>Әңгімеде кемінде 5 сөйлем бар</b><small>Бағдарлама санады: ' + sCount + ' сөйлем</small></div><div class="pts">' + (c1 ? "7,5" : "0") + ' / 7,5</div></li>' +
        '<li><div class="mark ' + (c2 ? "ok" : "bad") + '">' + (c2 ? "✓" : "✗") + '</div><div class="crit-body"><b>Кейіпкер, орын және зат мәтінде аталған</b><div class="chips">' + chips + '</div></div><div class="pts">' + (c2 ? "7,5" : "0") + ' / 7,5</div></li>' +
        '<li class="manual" data-c="3" tabindex="0" role="checkbox" aria-checked="false"><div class="check">✓</div><div class="crit-body"><b>Әңгіме таңдалған жанрдың («' + esc(combo.genre) + '») белгілеріне сай</b><small>Команда өзі белгілейді</small></div><div class="pts" id="p3">0 / 7,5</div></li>' +
        '<li class="manual" data-c="4" tabindex="0" role="checkbox" aria-checked="false"><div class="check">✓</div><div class="crit-body"><b>Әңгіменің басы, шиеленісі және соңы бар</b><small>Команда өзі белгілейді</small></div><div class="pts" id="p4">0 / 7,5</div></li>' +
      '</ul>' +
      '<div class="sum" id="sumLine" hidden></div>' +
      '<div class="btn-row" id="calcRow"><button class="btn gold" id="calcBtn" type="button">Ұпайды есептеу</button></div>' +
      '<div class="btn-row" id="nextRow" hidden><button class="btn" id="nextBtn" type="button">4-кезеңге өту</button></div>'
    );
    var locked = false;
    var manual = { 3: false, 4: false };
    function toggle(li) {
      if (locked) return;
      var c = li.getAttribute("data-c");
      manual[c] = !manual[c];
      li.classList.toggle("checked", manual[c]);
      li.setAttribute("aria-checked", manual[c] ? "true" : "false");
      document.getElementById("p" + c).textContent = (manual[c] ? "7,5" : "0") + " / 7,5";
    }
    document.querySelectorAll(".crit li.manual").forEach(function (li) {
      li.addEventListener("click", function () { toggle(li); });
      li.addEventListener("keydown", function (e) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(li); } });
    });
    document.getElementById("calcBtn").addEventListener("click", function () {
      locked = true;
      var pts = (c1 ? 7.5 : 0) + (c2 ? 7.5 : 0) + (manual[3] ? 7.5 : 0) + (manual[4] ? 7.5 : 0);
      setScore(2, pts);
      document.querySelectorAll(".crit li.manual").forEach(function (li) { li.style.cursor = "default"; li.setAttribute("aria-disabled", "true"); });
      var s = document.getElementById("sumLine");
      s.hidden = false; s.innerHTML = '3-кезең нәтижесі: <b>' + fmt(pts) + ' / 30</b> ұпай';
      document.getElementById("calcRow").hidden = true;
      document.getElementById("nextRow").hidden = false;
      document.getElementById("nextBtn").focus();
    });
    document.getElementById("nextBtn").addEventListener("click", function () { finishStage(2); });
  }

  // ---------------- 4-кезең ----------------
  function stage4() {
    var topic = pick(TOPICS);
    view(
      '<p class="eyebrow">4-кезең · әр дұрыс жол 6 ұпай</p>' +
      '<h2>Синквейн</h2>' +
      '<p class="lead">Бес жолдан тұратын өлең құрастырыңыз. Әр жолда белгіленген сөз саны болуы керек: 1, 2, 3, 4, 1.</p>' +
      '<div class="theme-badge"><svg width="18" height="18" aria-hidden="true"><use href="#i-star"/></svg>Тақырып: ' + esc(topic) + '</div>' +
      '<form id="cqForm" novalidate><div class="cq-lines">' +
      CQ.map(function (l, i) {
        return '<div class="cq-line"><div class="cq-n">' + (i + 1) + '</div><div><label for="cq' + i + '">' + l.label + '</label>' +
          '<input class="text-in" id="cq' + i + '" autocomplete="off" placeholder="' + esc(l.ph) + '"' + (i === 0 ? ' value="' + esc(topic) + '"' : "") + '></div></div>';
      }).join("") +
      '</div><div class="btn-row"><button class="btn gold" type="submit">Тексеру</button></div></form>'
    );
    document.getElementById("cqForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var lines = CQ.map(function (l, i) { return document.getElementById("cq" + i).value.trim(); });
      var res = lines.map(function (t, i) { var n = words(t).length; return { t: t, n: n, ok: n === CQ[i].need }; });
      var pts = res.filter(function (r) { return r.ok; }).length * 6;
      setScore(3, pts);
      view(
        '<p class="eyebrow">4-кезең · нәтиже</p>' +
        '<h2>Сіздің синквейніңіз</h2>' +
        '<div class="poem">' + res.map(function (r, i) {
          return '<p class="' + (r.ok ? "" : "badline") + '"' + (r.ok ? "" : ' data-need="' + (i + 1) + '-жол: ' + CQ[i].need + ' сөз керек, жазылғаны ' + r.n + '"') + '>' + (r.t ? esc(r.t) : "—") + '</p>';
        }).join("") + '</div>' +
        '<div class="line-scores">' + res.map(function (r, i) { return '<div class="' + (r.ok ? "ok" : "bad") + '">' + (i + 1) + '-жол<br>' + (r.ok ? "+6" : "0") + '</div>'; }).join("") + '</div>' +
        '<div class="sum">4-кезең нәтижесі: <b>' + pts + ' / 30</b> ұпай</div>' +
        '<div class="btn-row"><button class="btn gold" id="finBtn" type="button">Қорытынды нәтиже</button></div>'
      );
      document.getElementById("finBtn").addEventListener("click", function () { finishStage(3); });
    });
  }

  // ---------------- Қорытынды ----------------
  function rank(t) { return t >= 150 ? "Сөз шебері" : t >= 100 ? "Шебер оқырман" : "Жас талап"; }
  function showFinal() {
    S.stage = 4;
    var t = total(), r = rank(t);
    view(
      '<div class="final">' +
      '<p class="eyebrow">Квест аяқталды</p>' +
      '<p class="team">«' + esc(S.team) + '» командасы</p>' +
      '<div class="big">' + fmt(t) + '<span> / ' + MAX_TOTAL + '</span></div>' +
      '<div class="badge"><svg aria-hidden="true"><use href="#i-star"/></svg>' + r + '</div>' +
      '<div class="stage-cards">' + STAGES.map(function (st, i) {
        return '<div class="stage-card"><small>' + (i + 1) + '. ' + st.name + '</small><strong>' + fmt(S.scores[i]) + '<span> / ' + st.max + '</span></strong></div>';
      }).join("") + '</div>' +
      '<div class="btn-row"><button class="btn" id="copyBtn" type="button">Нәтижені көшіру</button><button class="btn gold" id="againBtn" type="button">Қайта ойнау</button></div>' +
      '<p class="hint" id="copyMsg" aria-live="polite"></p>' +
      '</div>'
    );
    var txt = "«Сөз шеберлері» әдеби квесті\n" +
      "Команда: " + S.team + "\n" +
      "Жалпы нәтиже: " + fmt(t) + " / " + MAX_TOTAL + " ұпай\n" +
      "Атақ: " + r + "\n" +
      STAGES.map(function (st, i) { return (i + 1) + "-кезең «" + st.name + "»: " + fmt(S.scores[i]) + " / " + st.max; }).join("\n");
    document.getElementById("copyBtn").addEventListener("click", function () {
      var msg = document.getElementById("copyMsg");
      function fallback() {
        var old = document.getElementById("copyFb");
        if (!old) {
          old = document.createElement("textarea");
          old.id = "copyFb"; old.className = "text-in copy-fallback"; old.readOnly = true; old.value = txt;
          msg.after(old);
        }
        old.focus(); old.select();
        msg.textContent = "Мәтін белгіленді: оны өзіңіз көшіріп алыңыз (Ctrl+C немесе ұзақ басу).";
      }
      try {
        navigator.clipboard.writeText(txt).then(function () { msg.textContent = "Нәтиже көшірілді!"; }, fallback);
      } catch (e) { fallback(); }
    });
    document.getElementById("againBtn").addEventListener("click", showStart);
  }

  // ---------------- Іске қосу ----------------
  function start(data) {
    if (data && data.S && data.S.team) {
      S = data.S;
      document.getElementById("scoreNum").textContent = fmt(total());
      if (S.stage === 4) showFinal();
      else if (S.stage >= 0) {
        // кезеңді басынан бастаймыз: сол кезеңнің ұпайын нөлдейміз
        S.scores[S.stage] = 0;
        document.getElementById("scoreNum").textContent = fmt(total());
        startStage(S.stage);
      } else showStart();
      return;
    }
    showStart();
  }
  if (window.claude && window.claude.hot) {
    try { window.claude.hot.snapshot(function () { return { S: S }; }); } catch (e) {}
  }
  window.claude && window.claude.hot && window.claude.hot.ready ? window.claude.hot.ready(start) : start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
</body>
</html>
